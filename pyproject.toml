[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ma"
version = "0.3.0"
description = "Model-based adaptive moving averages: a state-space Kalman filter toolkit with multiscale decomposition, microstructure-noise instruments, and an honest-evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "nothankyouzzz"}]
keywords = [
    "kalman-filter",
    "moving-average",
    "state-space",
    "multiscale",
    "time-series",
    "market-microstructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.10",
]

[project.optional-dependencies]
eval = [
    "pandas>=1.4",
    "requests>=2.28",
    "matplotlib>=3.5",
]
dev = [
    "pandas>=1.4",
    "requests>=2.28",
    "matplotlib>=3.5",
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/nothankyouzzz/adaptive-ma"
Repository = "https://github.com/nothankyouzzz/adaptive-ma"
Issues = "https://github.com/nothankyouzzz/adaptive-ma/issues"

[tool.setuptools.packages.find]
include = ["adaptive_ma", "adaptive_ma.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
