[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ma"
version = "0.2.0"
description = "A model-based adaptive moving average (multiscale state-space Kalman filter & volatility clustering)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "nothankyouzzz"}]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "scipy>=1.10",
    "matplotlib>=3.5",
    "pandas>=1.4",
    "requests>=2.28",
    "tabulate>=0.9.0",
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = [
    "adaptive_ma",
    "kalman_core",
    "params",
    "instruments",
    "multiscale_ma",
    "volatility_ma",
    "estimate",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
